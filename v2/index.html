<!DOCTYPE html>
<html lang="mi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Te reo Māori Kendall Toy Test</title>
  <link rel="icon" href="icon-192.png" sizes="192x192" />


  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">

<!-- PWA (Chrome/Android) -->
<meta name="mobile-web-app-capable" content="yes">

<!-- PWA (iOS) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

    
<style>
  :root { --gap: 14px; --cell: 140px; }

  /* Fill the screen, handle iOS browser chrome safely */
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #111;
  }

  /* General layout */
  .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar img { height: 42px; }
  h1 { font-size: clamp(1.1rem, 2.4vw, 1.8rem); margin: 0; }

  /* Controls */
  .controls { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
  select, button, label { padding: .55rem .8rem; border-radius: .6rem; border: 1px solid #ccc; background: #fff; }
  button { cursor: pointer; }
  .muted { color: #666; }

  /* Views (settings/test) */
  .view { display: none; }
  .view.active {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
    box-sizing: border-box;
  }

  /* Test view: allow full device width (remove the 1100px cap) */
  #testView .container {
    max-width: none;
    width: 100%;
    padding-left: max(8px, env(safe-area-inset-left));
    padding-right: max(8px, env(safe-area-inset-right));
  }

  /* Test grid: take remaining vertical space, start at top to avoid big row gaps */
  #testView .grid {
    flex: 1 1 auto;
    min-height: 0; /* prevents flex overflow on iOS */
    display: grid;
    gap: clamp(8px, 1.6vw, 14px);   /* slightly smaller on phones, max 14px */
    justify-content: center;        /* center horizontally */
    align-content: start;           /* start at top to avoid extra vertical whitespace */
    margin-top: 12px;
  }

  /* Orientation helpers (JS will still compute exact size/columns) */
  .grid.landscape { grid-template-columns: repeat(5, var(--cell, 140px)); }
  .grid.portrait  { grid-template-columns: repeat(3, var(--cell, 140px)); }

  /* Fallback (non-JS) so it still looks reasonable */
  .grid:not(.landscape):not(.portrait) {
    grid-template-columns: repeat(5, minmax(120px, 1fr));
  }

  /* Cells & content */
  .cell {
    width: var(--cell, 140px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 2px solid #bbb;
    border-radius: 16px;
    padding: 10px;
    gap: 8px;
    user-select: none;
    transition: border-color .2s ease, box-shadow .2s ease, transform .06s ease;
    box-sizing: border-box; /* prevent wrap/overlap from border width */
  }
  .cell:active { transform: scale(.985); }

  .cell.correct   { border-color: #2e7d32; box-shadow: 0 0 0 2px rgba(46,125,50,.18); }
  .cell.incorrect { border-color: #c62828; box-shadow: 0 0 0 2px rgba(198,40,40,.18); }
  .cell.neutral   { border-color: #607d8b; box-shadow: 0 0 0 2px rgba(96,125,139,.20); }

  .thumb { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; }
  .label { font-weight: 600; font-size: 1rem; text-align: center; }

  .status { min-height: 1.5rem; margin-top: 8px; }

  /* Test header (icons) */
  .test-topbar {
    position: fixed;   /* ensure always clickable above grid */
    top: 8px;
    right: 16px;
    z-index: 2147483647;
    pointer-events: auto;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    padding: 6px;
    border-radius: 10px;
    border: 1px solid #ccc;
  }
  .iconbtn {
    width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid #ccc; background: #fff; border-radius: .6rem;
    cursor: pointer; font-size: 18px;
  }
  .iconbtn:active { transform: scale(.98); }

  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: .95rem; }
  a.link { text-decoration: none; }

  /* ── Manual test screens ────────────────────────── */
  #manualSetupView, #manualTestView {
    display: none; flex-direction: column;
    height: 100dvh; overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px; color: #111; background: #fafafa;
  }
  #manualSetupView.active, #manualTestView.active { display: flex; }

  /* UC header */
  .mt-uc-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: #fff; border-bottom: 1px solid #e0e0e0;
    flex-shrink: 0; gap: 12px; flex-wrap: wrap;
  }
  .mt-uc-header-left  { display: flex; align-items: center; gap: 10px; }
  .mt-uc-header-right { display: flex; gap: 6px; align-items: center; }
  .mt-uc-logo         { height: 36px; flex-shrink: 0; }
  .mt-uc-title        { font-size: 14px; font-weight: 700; color: #111; }
  .mt-uc-subtitle     { font-size: 11px; color: #888; margin-top: 1px; }

  /* Info bar (test screen) */
  .mt-info-bar {
    display: flex; align-items: center; gap: 10px; padding: 6px 14px;
    background: #f7f7f7; border-bottom: 1px solid #e8e8e8; flex-wrap: wrap; flex-shrink: 0;
  }
  .mt-info-client { font-size: 13px; font-weight: 700; color: #111; }
  .mt-info-list   { font-size: 12px; color: #888; }
  .mt-info-mode   { font-size: 11px; color: #aaa; }
  .mt-label-toggle { font-size: 11px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 3px; margin-left: auto; }
  .mt-label-seg { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .mt-label-seg-title { font-size: 11px; color: #888; margin-right: 2px; }
  .mt-label-seg-btn {
    font-size: 11px; padding: 3px 9px; background: #fff; color: #666;
    cursor: pointer; border: 1px solid #ddd; border-radius: 5px; line-height: 1.4;
  }
  .mt-label-seg-btn.on { background: #e8f0fc; color: #1a5fa5; font-weight: 700; border-color: #9ab8f0; }
  .mt-intest-banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #fff8e1; border: 1px solid #ffe08a; border-radius: 8px;
    padding: 8px 12px; margin: 8px 0; font-size: 12px; color: #7a5b00;
  }
  .mt-intest-banner span { flex: 1; min-width: 180px; line-height: 1.4; }

  /* Shared button/card tokens */
  .mt-btn {
    font-size: 12px; padding: 5px 10px; border: 1px solid #ccc; border-radius: 6px;
    background: #fff; color: #111; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block;
  }
  .mt-btn:hover { background: #f0f0f0; }
  .mt-btn-primary {
    font-size: 12px; padding: 6px 12px; border: none; border-radius: 6px;
    background: #1a5fa5; color: #fff; cursor: pointer; font-weight: 600;
  }
  .mt-btn-primary:hover { background: #0d4a8a; }
  .mt-btn-primary:disabled { opacity: .4; cursor: default; }
  .mt-btn-sm-primary { font-size: 12px; padding: 4px 10px; border: none; border-radius: 6px; background: #1a5fa5; color: #fff; cursor: pointer; }
  .mt-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; }
  .mt-section { display: flex; flex-direction: column; gap: 5px; }
  .mt-section-label { font-size: 11px; font-weight: 700; color: #888; letter-spacing: .04em; }
  .mt-divider { height: 1px; background: #e8e8e8; margin: 3px 0; }
  .mt-hint-text { font-size: 11px; color: #888; }

  /* Setup layout */
  .mt-setup-body  { display: grid; grid-template-columns: 1fr 260px; flex: 1; min-height: 0; overflow-y: auto; }
  .mt-setup-left  { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid #e0e0e0; }
  .mt-setup-right { padding: 14px; display: flex; flex-direction: column; gap: 12px; background: #f7f7f7; }

  /* Form */
  .mt-form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .mt-form-row:last-child { margin-bottom: 0; }
  .mt-field-label { font-size: 11px; color: #666; margin-bottom: 3px; }
  .mt-inp { width: 100%; font-size: 13px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #111; box-sizing: border-box; }

  /* List selector */
  .mt-list-card { padding: 5px 6px; }
  .mt-list-item { display: flex; align-items: center; gap: 7px; padding: 8px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; min-width: 0; }
  .mt-list-item:hover { background: #f5f5f5; }
  .mt-list-item.active { background: #e8f0fc; border-color: #3a7de0; }
  .mt-list-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .mt-list-dot.custom  { background: #3a7de0; }
  .mt-list-dot.builtin { background: #999; }
  .mt-list-name { flex: 1; font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mt-list-meta { font-size: 11px; color: #888; flex-shrink: 0; white-space: nowrap; }
  .mt-badge { font-size: 10px; padding: 1px 5px; border-radius: 10px; margin-left: 5px; vertical-align: middle; }
  .mt-badge.custom  { background: #e8f0fc; color: #1a5fa5; border: 1px solid #9ab8f0; }
  .mt-badge.builtin { background: #f0f0f0; color: #666; border: 1px solid #d0d0d0; }

  /* Scoring cards */
  .mt-scoring-cards { display: flex; gap: 7px; flex-wrap: wrap; }
  .mt-scoring-card { flex: 1; min-width: 130px; border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px; cursor: pointer; background: #fff; }
  .mt-scoring-card:hover { border-color: #aaa; }
  .mt-scoring-card.active { border-color: #3a7de0; background: #e8f0fc; }
  .mt-scoring-title { font-size: 12px; font-weight: 700; color: #111; margin-bottom: 3px; }
  .mt-scoring-card.active .mt-scoring-title { color: #1a5fa5; }
  .mt-scoring-desc  { font-size: 11px; color: #666; line-height: 1.4; }

  /* View toggle */
  .mt-seg { display: flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
  .mt-seg-btn { flex: 1; font-size: 12px; padding: 5px 10px; background: #fff; color: #666; cursor: pointer; border: none; }
  .mt-seg-btn.on { background: #e8f0fc; color: #1a5fa5; font-weight: 700; }

  /* Test layout */
  .mt-test-body { display: grid; grid-template-columns: 1fr 210px; flex: 1; min-height: 0; overflow: hidden; }
  .mt-test-main { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid #e0e0e0; }
  .mt-test-sidebar { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; background: #f7f7f7; overflow-y: auto; }
  .mt-side-section { display: flex; flex-direction: column; gap: 4px; }

  /* Level bar */
  .mt-level-bar { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; background: #fff; flex-shrink: 0; }
  .mt-slabel { font-size: 11px; font-weight: 700; color: #888; letter-spacing: .04em; }
  .mt-level-btn { font-size: 15px; padding: 4px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; line-height: 1; }
  .mt-level-btn:hover { background: #f0f0f0; }
  .mt-level-disp { font-size: 16px; font-weight: 700; min-width: 64px; text-align: center; }
  .mt-manual-wrap { display: flex; align-items: center; gap: 4px; margin-left: 2px; }
  .mt-manual-level { font-size: 13px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px; width: 52px; text-align: center; background: #fff; }
  .mt-armed-label { font-size: 12px; color: #555; font-style: italic; }
  .mt-play-btn { font-size: 13px !important; padding: 7px 16px !important; }

  /* Table */
  .mt-table-wrap { flex: 1; overflow: auto; }
  .mt-table-empty { padding: 32px 20px; text-align: center; font-size: 13px; color: #aaa; }
  .mt-ktable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .mt-ktable th { font-size: 11px; font-weight: 700; color: #666; padding: 5px 4px; text-align: center; border-bottom: 1px solid #ddd; white-space: nowrap; background: #f7f7f7; position: sticky; top: 0; z-index: 1; }
  .mt-th-kupu { text-align: left; padding-left: 10px; min-width: 70px; }
  .mt-th-level.current-level { background: #ddeeff; color: #1a5fa5; }
  .mt-ktable td { padding: 3px 4px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  .mt-kupu-td { padding-left: 10px; white-space: nowrap; }
  .mt-score-td { text-align: center; min-width: 52px; }
  .mt-score-td.current-level { background: #f0f7ff; }
  .mt-row-armed td { background: #eef5ff !important; }
  .mt-ktable tr:hover td { background: #f8f8f8; }
  .mt-session-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px;
    border-radius: 6px; border-bottom: 1px solid #f0f0f0;
  }
  .mt-session-item:last-child { border-bottom: none; }
  .mt-session-info {
    flex: 1; cursor: pointer; border-radius: 5px; padding: 2px 4px;
  }
  .mt-session-info:hover { background: #f0f5ff; }
  .mt-session-list { font-size: 13px; font-weight: 700; color: #111; }
  .mt-session-meta { font-size: 11px; color: #888; margin-top: 1px; }
  .mt-row-armed:hover td { background: #e4f0ff !important; }

  /* Kupu name / image */
  .mt-kupu-name { display: inline-block; padding: 3px 7px; border-radius: 6px; font-weight: 700; cursor: pointer; color: #111; }
  .mt-kupu-name:hover { background: #e8f0fc; color: #1a5fa5; }
  .mt-kupu-name.armed { background: #1a5fa5; color: #fff; }
  .mt-kupu-img-wrap { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 2px; border-radius: 6px; width: 60px; }
  .mt-kupu-img-wrap:hover { background: #e8f0fc; }
  .mt-kupu-img-wrap.armed { background: #1a5fa5; border-radius: 6px; }
  .mt-kupu-img { width: 50px; height: 50px; object-fit: contain; border-radius: 4px; cursor: pointer; }
  .mt-kupu-img.armed-img { outline: 3px solid #1a5fa5; border-radius: 4px; }
  .mt-kupu-img-label { font-size: 10px; color: #555; text-align: center; }
  .mt-kupu-img-wrap.armed .mt-kupu-img-label { color: #fff; }

  /* Pips */
  .mt-pip-wrap { display: flex; justify-content: center; align-items: center; gap: 3px; min-height: 22px; }
  .mt-pip { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #ccc; cursor: pointer; transition: transform .08s; background: #f0f0f0; flex-shrink: 0; }
  .mt-pip:hover { transform: scale(1.2); border-color: #999; }
  .mt-pip.correct   { background: #4a9e1a; border-color: #2d7010; }
  .mt-pip.incorrect { background: #d94040; border-color: #a02020; }
  .mt-pip.empty     { background: #f0f0f0; }

  /* Sidebar */
  .mt-level-big  { font-size: 32px; font-weight: 700; line-height: 1; display: inline; }
  .mt-level-unit { font-size: 14px; color: #888; }
  .mt-score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .mt-score-tile { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 6px 8px; text-align: center; }
  .mt-score-v { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .mt-score-l { font-size: 10px; color: #888; margin-top: 1px; }
  .green-v { color: #2d7010; }
  .red-v   { color: #a02020; }
  .mt-carrier { font-style: italic; color: #555; font-size: 12px; line-height: 1.5; }
  .mt-phrases { display: flex; flex-direction: column; gap: 4px; }
  .mt-phrase-row { display: flex; flex-direction: column; }
  .mt-phrase-mi { font-size: 12px; color: #111; font-weight: 700; }
  .mt-phrase-en { font-size: 10px; color: #888; }
  .mt-notes { width: 100%; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; padding: 6px 8px; color: #111; background: #fff; resize: vertical; min-height: 56px; box-sizing: border-box; }

  /* Legend */
  .mt-legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 5px 4px; font-size: 11px; color: #666; }
  .mt-leg-item { display: flex; align-items: center; gap: 3px; }
  .mt-leg-pip { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #ccc; }
  .mt-leg-pip.correct   { background: #4a9e1a; border-color: #2d7010; }
  .mt-leg-pip.incorrect { background: #d94040; border-color: #a02020; }
  .mt-leg-pip.empty     { background: #f0f0f0; }

  @media (max-width: 700px) {
    #manualSetupView, #manualTestView {
      height: auto; overflow: visible;
    }
    .mt-setup-body {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      overflow: visible;
      min-height: 0;
    }
    .mt-setup-left  {
      border-right: none; border-bottom: 1px solid #e0e0e0;
      overflow-y: visible; height: auto; min-height: 0;
    }
    .mt-setup-right {
      border-top: none; overflow-y: visible; height: auto; min-height: 0;
    }

    /* UC header — tighten up */
    .mt-uc-header { padding: 8px 12px; gap: 8px; }
    .mt-uc-logo   { height: 28px; }
    .mt-uc-title  { font-size: 13px; }
    .mt-uc-header-right { flex-wrap: wrap; gap: 4px; }

    /* Form rows — single column on small screens */
    .mt-form-row { flex-direction: column; gap: 6px; }
    .mt-form-row > div { min-width: 0 !important; flex: none !important; width: 100%; }

    /* List items — prevent wrapping */
    .mt-list-item { padding: 8px 6px; gap: 5px; }
    .mt-list-name { font-size: 12px; min-width: 0; }
    .mt-list-meta { white-space: nowrap; font-size: 10px; }
    .mt-badge     { display: none; }  /* hide badge on mobile to save space */

    /* Scoring cards — stack vertically */
    .mt-scoring-cards { flex-direction: column; }
    .mt-scoring-card  { min-width: 0; }

    /* Actions — already full width, just tighten padding */
    .mt-card { padding: 8px 10px; }

    /* Test screen — full single column, sidebar below */
    .mt-test-body {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      overflow: visible;
    }
    .mt-test-main    { overflow: visible; border-right: none; border-bottom: 1px solid #e0e0e0; }
    .mt-test-sidebar { border-top: none; overflow: visible; }
    .mt-table-wrap   { overflow-x: auto; }

    /* Level bar — wrap gracefully */
    .mt-level-bar { gap: 5px; padding: 6px 8px; }
    .mt-level-disp { font-size: 14px; min-width: 52px; }
    .mt-level-btn  { padding: 4px 8px; font-size: 14px; }
    .mt-play-btn   { padding: 7px 12px !important; }

    /* Info bar */
    .mt-info-bar { padding: 5px 10px; gap: 6px; }
    .mt-label-toggle { margin-left: 0; }
    .mt-label-seg { margin-left: 0; flex-wrap: wrap; }

    /* Topbar */
    .mt-topbar { padding: 7px 10px; gap: 5px; }
    .mt-uc-titles { display: none; }  /* hide subtitle on very small screens */
  }

  @media (max-width: 400px) {
    .mt-uc-title  { font-size: 12px; }
    .mt-level-bar { flex-wrap: wrap; }
    .mt-armed-label { width: 100%; order: 10; }
  }

  .mt-topbar {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    border-bottom: 1px solid #e0e0e0; background: #f5f5f5; flex-wrap: wrap;
  }
  .mt-topbar-title { font-size: 13px; font-weight: 600; flex: 1; }
  .mt-topbar-meta  { font-size: 11px; color: #666; }
  .mt-topbar-right { display: flex; gap: 5px; align-items: center; }
  .mt-btn {
    font-size: 12px; padding: 5px 10px; border: 1px solid #ccc; border-radius: 6px;
    background: #fff; color: #111; cursor: pointer; white-space: nowrap; text-decoration: none;
  }
  .mt-btn:hover { background: #f0f0f0; }
  .mt-btn-primary {
    font-size: 12px; padding: 6px 12px; border: none; border-radius: 6px;
    background: #1a5fa5; color: #fff; cursor: pointer; font-weight: 600;
  }
  .mt-btn-primary:hover { background: #0d4a8a; }
  .mt-btn-primary:disabled { opacity: .4; cursor: default; }
  .mt-btn-sm-primary {
    font-size: 12px; padding: 4px 10px; border: none; border-radius: 6px;
    background: #1a5fa5; color: #fff; cursor: pointer;
  }

</style>


<script>
  // Service worker registration + version awareness (#8 cache-buster)
  window.KTT_APP_VERSION = null;   // filled in once the SW reports it
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('SW registered', reg.scope);
          // Ask the active SW for its version (shown in the diagnostic panel).
          function askVersion(sw) {
            if (!sw) return;
            const ch = new MessageChannel();
            ch.port1.onmessage = (e) => {
              if (e.data && e.data.version) {
                window.KTT_APP_VERSION = e.data.version;
                console.log('KTT app version', e.data.version);
              }
            };
            try { sw.postMessage({ type: 'GET_VERSION' }, [ch.port2]); } catch (_) {}
          }
          askVersion(reg.active || navigator.serviceWorker.controller);

          // Detect a new version installing while the page is open.
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                // A fresh build is ready and an old one is currently controlling.
                window.dispatchEvent(new CustomEvent('ktt-update-ready'));
              }
            });
          });
        })
        .catch(err => console.error('SW registration failed', err));

      // When the new SW activates, it messages us; offer a one-tap reload.
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'SW_ACTIVATED') {
          window.KTT_APP_VERSION = e.data.version;
        }
      });
    });

    // A controllerchange means a new SW took over — reload to run fresh code,
    // but never yank the page out from under an in-progress test.
    let _reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (_reloaded) return;
      const testActive = !!(window.kttManual && typeof window.kttManual.isTestActive === 'function'
        && window.kttManual.isTestActive());
      if (testActive) {
        console.log('KTT: update ready, deferring reload until test ends');
        window.dispatchEvent(new CustomEvent('ktt-update-ready'));
        return;
      }
      _reloaded = true;
      location.reload();
    });
  }
</script>

  <div id="ktt-debug-panel">
    <div class="ktt-debug-toolbar">
      <span>🐛 KTT Debug Log</span>
      <input id="ktt-debug-filter" type="search" placeholder="Filter…">
      <button id="ktt-debug-copy">Copy all</button>
      <button id="ktt-debug-clear">Clear</button>

    </div>

  <script>
  (() => {
    const MAX_ENTRIES = 500;
    const entries = [];
    let filterText = '';
    let isOpen = false;

    const panel   = document.getElementById('ktt-debug-panel');
    const logEl   = document.getElementById('ktt-debug-log');
    const filterEl = document.getElementById('ktt-debug-filter');

    function ts() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
    }

    function addEntry(level, args) {
      const text = args.map(a => {
        if (typeof a === 'object' && a !== null) {
          try { return JSON.stringify(a, null, 0); } catch { return String(a); }
        }
        return String(a);
      }).join(' ');

      const entry = { ts: ts(), level, text };
      entries.push(entry);
      if (entries.length > MAX_ENTRIES) entries.shift();
      if (isOpen) appendEntryEl(entry);
    }

    function appendEntryEl(entry) {
      if (filterText && !entry.text.toLowerCase().includes(filterText)) return;

      const div = document.createElement('div');
      div.className = `ktt-log-entry ${entry.level}`;

      const tsSpan = document.createElement('span');
      tsSpan.className = 'ktt-log-ts';
      tsSpan.textContent = entry.ts;

      const textNode = document.createTextNode(entry.text);

      div.appendChild(tsSpan);

      // Highlight [KTT] prefix in blue
      if (entry.text.startsWith('[KTT]')) {
        const kttSpan = document.createElement('span');
        kttSpan.className = 'ktt-log-ktt';
        kttSpan.textContent = '[KTT]';
        div.appendChild(kttSpan);
        div.appendChild(document.createTextNode(entry.text.slice(5)));
      } else {
        div.appendChild(textNode);
      }

      logEl.appendChild(div);
      // Keep scroll at bottom
      logEl.scrollTop = logEl.scrollHeight;
    }

    function rerender() {
      logEl.innerHTML = '';
      entries.forEach(appendEntryEl);
    }

    // Intercept console methods
    const _log  = console.log.bind(console);
    const _warn = console.warn.bind(console);
    const _err  = console.error.bind(console);

    console.log = (...args) => { _log(...args);  addEntry('log',  args); };
    console.warn= (...args) => { _warn(...args); addEntry('warn', args); };
    console.error=(...args) => { _err(...args);  addEntry('err',  args); };

    // Catch unhandled errors
    window.addEventListener('error', e => {
      addEntry('err', [`Uncaught: ${e.message}`, `@ ${e.filename}:${e.lineno}`]);
    });
    window.addEventListener('unhandledrejection', e => {
      addEntry('err', [`Unhandled promise rejection: ${e.reason}`]);
    });

    function toggle() {
      isOpen = !isOpen;
      panel.classList.toggle('open', isOpen);
      if (isOpen) { rerender(); logEl.scrollTop = logEl.scrollHeight; }
    }

    document.getElementById('ktt-debug-close').onclick = () => toggle();
    document.getElementById('ktt-debug-clear').onclick = () => {
      entries.length = 0; logEl.innerHTML = '';
    };
    document.getElementById('ktt-debug-copy').onclick = () => {
      const text = entries.map(e => `${e.ts} [${e.level.toUpperCase()}] ${e.text}`).join('\n');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard'));
      } else {
        // Fallback for older iOS
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        alert('Copied to clipboard');
      }
    };
    filterEl.oninput = e => {
      filterText = e.target.value.toLowerCase().trim();
      rerender();
    };

    // Expose globally
    window.kttDebugPanel = { toggle, entries };

    // Log startup
    console.log('[KTT] 🐛 Debug panel ready. Call kttDebugPanel.toggle() or tap "Debug log".');
  })();
  </script>
